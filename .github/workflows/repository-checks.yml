name: Repository checks

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify attribution in an independent process
        shell: powershell
        run: ./tools/verify-attribution.ps1
      - name: Verify Keil paths
        shell: powershell
        run: ./tools/verify-project.ps1
      - name: Verify project identity
        shell: powershell
        run: ./tools/verify-project-origin.ps1
      - name: Verify third-party notices
        shell: powershell
        run: ./tools/verify-third-party-headers.ps1
      - name: Scan private machine paths
        shell: powershell
        run: ./tools/privacy-scan.ps1
      - name: Verify OLED-visible strings
        shell: powershell
        run: ./tools/verify-oled-ascii.ps1
