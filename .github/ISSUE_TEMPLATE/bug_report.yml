name: Bug report
description: Report a reproducible firmware or documentation problem.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Operate the vehicle safely and never debug an uncontrolled powered chassis."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Commissioning stage
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and wiring
    validations:
      required: true
